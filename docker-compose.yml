services:
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payouts
      POSTGRES_PASSWORD: localdev_only_change_me
      POSTGRES_DB: payouts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payouts"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://payouts:localdev_only_change_me@db:5432/payouts
      PAYSWIFT_BASE_URL: http://payswift:8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      db:
        condition: service_healthy
      payswift:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
