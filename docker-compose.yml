services:
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/local.db
      PAYSWIFT_BASE_URL: http://payswift:8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      payswift:
        condition: service_started
    restart: on-failure
